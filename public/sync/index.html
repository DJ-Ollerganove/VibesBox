<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibesBox Sync</title>
  <meta name="description" content="VibesBox Sync für Windows und Mac herunterladen.">
  <link rel="icon" type="image/png" href="/vb/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="/vb/scripts/default-pwa-languages.js?v=8"></script>
  <script src="/pwa-text-direction.js?v=2"></script>
  <link rel="stylesheet" href="/pwa-rtl.css?v=2">
  <style>
    :root {
      --bg: #1A1A1A;
      --bg-dark: #1A1A1A;
      --card: #242424;
      --accent: #d4834d;
      --text: #F0F0F0;
      --muted: #b0b0b0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }
    .topbar {
      position: relative;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px 20px 0;
    }
    .topbar > a {
      flex-shrink: 0;
      line-height: 0;
    }
    .header-schriftzug {
      height: 45px;
      width: auto;
      display: block;
    }
    @media (max-width: 640px) {
      .header-schriftzug { height: 36px; }
      .topbar { padding: 12px 14px 0; }
    }
    .lang-switcher {
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .main-lang-wrap { position: relative; }
    .main-lang-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: var(--bg-dark);
      border: 1px solid var(--accent);
      border-radius: 8px;
      color: var(--accent);
      font-size: 1.25rem;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s, color 0.2s, box-shadow 0.2s;
      flex-shrink: 0;
    }
    .main-lang-btn:hover {
      background: rgba(212, 131, 77, 0.15);
      box-shadow: 0 0 12px rgba(212, 131, 77, 0.3);
    }
    .main-lang-btn[aria-expanded="true"] {
      background: rgba(212, 131, 77, 0.2);
      box-shadow: 0 0 12px rgba(212, 131, 77, 0.3);
    }
    .main-lang-dropdown {
      position: absolute;
      top: 100%;
      right: 0;
      margin-top: 8px;
      min-width: 200px;
      max-width: min(96vw, 680px);
      background: #1A1A1A;
      border: 1px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(212, 131, 77, 0.25);
      padding: 10px;
      z-index: 150;
      display: none;
      overflow: visible;
    }
    .main-lang-dropdown.show { display: block; }
    .lang-menu-columns {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      gap: 10px;
      width: max-content;
      max-width: 100%;
    }
    .lang-menu-column {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 0 0 auto;
      width: min(148px, 42vw);
    }
    .lang-menu-scroll-wrap { position: relative; width: 100%; }
    .lang-menu-scroll-area {
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
      scrollbar-color: rgba(212, 131, 77, 0.6) transparent;
    }
    .lang-menu-scroll-area::-webkit-scrollbar { height: 5px; }
    .lang-menu-scroll-area::-webkit-scrollbar-thumb {
      background: rgba(212, 131, 77, 0.6);
      border-radius: 3px;
    }
    .lang-menu-scroll-peek { flex: 0 0 20px; width: 20px; min-width: 20px; }
    .lang-menu-scroll-fade {
      position: absolute; top: 0; bottom: 0; width: 36px;
      pointer-events: none; z-index: 2; opacity: 0; transition: opacity 0.2s;
    }
    .lang-menu-scroll-wrap.lang-menu-scroll--scrollable:not(.lang-menu-scroll--at-end) .lang-menu-scroll-fade--right { opacity: 1; }
    .lang-menu-scroll-wrap.lang-menu-scroll--scrollable:not(.lang-menu-scroll--at-start) .lang-menu-scroll-fade--left { opacity: 1; }
    .lang-menu-scroll-fade--left {
      left: 0;
      background: linear-gradient(to right, #1A1A1A 40%, transparent);
    }
    .lang-menu-scroll-fade--right {
      right: 0;
      background: linear-gradient(to left, #1A1A1A 40%, transparent);
    }
    .lang-menu-scroll-chevron {
      position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
      width: 30px; height: 30px; border: 1px solid var(--accent); border-radius: 50%;
      background: rgba(0,0,0,0.55); color: var(--accent); font-size: 20px;
      cursor: pointer; display: none; align-items: center; justify-content: center;
      padding: 0 0 2px 0;
    }
    .lang-menu-scroll-wrap.lang-menu-scroll--scrollable:not(.lang-menu-scroll--at-start) .lang-menu-scroll-chevron--left,
    .lang-menu-scroll-wrap.lang-menu-scroll--scrollable:not(.lang-menu-scroll--at-end) .lang-menu-scroll-chevron--right {
      display: flex;
    }
    .lang-menu-scroll-chevron--left { left: 2px; }
    .lang-menu-scroll-chevron--right { right: 2px; }
    .lang-menu-scroll-hint {
      margin-top: 6px; font-size: 11px; color: var(--accent); text-align: center;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .lang-menu-scroll-hint::before { content: '↔'; font-size: 13px; }
    .main-lang-option {
      display: flex;
      align-items: center;
      white-space: nowrap;
      width: 100%;
      padding: 10px 16px;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 0.9rem;
      font-weight: 500;
      text-align: start;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
      gap: 0;
      box-sizing: border-box;
    }
    .main-lang-option .main-lang-flag {
      width: 1.33em;
      height: 1em;
      flex-shrink: 0;
      display: block;
    }
    .main-lang-option .main-lang-flag svg {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }
    .main-lang-option .main-lang-name { margin-inline-start: 12px; }
    .main-lang-option:hover {
      background: rgba(212, 131, 77, 0.2);
      color: var(--accent);
    }
    .main-lang-option.active {
      background: rgba(212, 131, 77, 0.25);
      color: var(--accent);
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 32px;
    }
    .card {
      width: min(520px, 100%);
      background: var(--card);
      border: 1px solid rgba(212, 131, 77, 0.45);
      border-radius: 16px;
      padding: 36px 28px 28px;
      text-align: center;
    }
    h1 {
      margin: 0 0 28px;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.35;
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 18px 0;
      font-size: 18px;
      font-weight: 600;
    }
    .logo {
      width: 36px;
      height: 36px;
      flex: 0 0 36px;
    }
    a.download {
      color: var(--accent);
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a.download:hover { color: #e0945a; }
    .ver {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 400;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="/" aria-label="VibesBox">
      <img src="/vb-schriftzug.png" alt="VibesBox" class="header-schriftzug" width="980" height="171">
    </a>
    <div class="lang-switcher" id="langSwitcher" aria-label="Select language"></div>
  </header>
  <main>
    <div class="card">
      <h1 data-i18n="sync_page_heading">Hier kannst du VibesBox Sync downloaden</h1>
      <div class="row">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#00A4EF" d="M0 0h11.4v11.4H0z"/>
          <path fill="#7FBA00" d="M12.6 0H24v11.4H12.6z"/>
          <path fill="#FFB900" d="M0 12.6h11.4V24H0z"/>
          <path fill="#F25022" d="M12.6 12.6H24V24H12.6z"/>
        </svg>
        <div>
          <span data-i18n="sync_page_windows">Für Windows:</span>
          <a class="download" href="/sync/VibesBox-Sync-windows.exe" download="VibesBox-Sync-windows.exe" data-i18n="sync_page_download">Download</a>
          <span class="ver" id="win-ver">Version …</span>
        </div>
      </div>
      <div class="row">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="#F0F0F0" d="M16.4 12.6c0-2.3 1.9-3.4 2-3.5-1.1-1.6-2.8-1.8-3.4-1.8-1.4-.2-2.8.9-3.5.9s-1.8-.8-3-.8c-1.5 0-3 .9-3.8 2.3-1.6 2.8-.4 7 1.2 9.3.8 1.1 1.7 2.3 2.9 2.3 1.2 0 1.6-.7 3-.7s1.8.7 3 .7 2-.1 2.9-2.3c.7-1 1.2-2 1.5-3.1-3.9-1.5-3.8-5.6-1.8-6.3zM14.7 5.8c.6-.8 1.1-1.9.9-3-1 .1-2.1.7-2.8 1.5-.6.7-1.2 1.8-.9 2.9 1.1.1 2.1-.5 2.8-1.4z"/>
        </svg>
        <div>
          <span data-i18n="sync_page_mac">Für macOS:</span>
          <a class="download" href="/sync/VibesBox-Sync-mac.pkg" download="VibesBox-Sync-mac.pkg" data-i18n="sync_page_download">Download</a>
          <span class="ver" id="mac-ver">Version …</span>
        </div>
      </div>
    </div>
  </main>
  <script src="/lang-menu-columns.js"></script>
  <script src="/lang_menu_shared.js?v=10"></script>
  <script>
    (function () {
      var SYNC_LANG_ASSET_V = '20261007sync1';
      var syncVersions = { windows: '', mac: '' };

      function packFor(lang) {
        var all = window.translations || {};
        return all[lang] || all.en || {};
      }

      function currentLang() {
        if (typeof window.getEffectiveLangForMenu === 'function') return window.getEffectiveLangForMenu();
        return 'en';
      }

      function renderVersions() {
        var tpl = packFor(currentLang()).sync_page_version || 'Version {version}';
        function set(id, num) {
          var el = document.getElementById(id);
          if (!el) return;
          el.textContent = String(tpl).replace('{version}', num || '…');
        }
        set('win-ver', syncVersions.windows);
        set('mac-ver', syncVersions.mac);
      }

      function applySyncPage() {
        var lang = currentLang();
        if (typeof window.pwaApplyTextDirection === 'function') window.pwaApplyTextDirection(lang);
        var t = packFor(lang);
        document.querySelectorAll('[data-i18n]').forEach(function (el) {
          var key = el.getAttribute('data-i18n');
          if (key && t[key] != null && t[key] !== '') el.textContent = t[key];
        });
        var meta = document.querySelector('meta[name="description"]');
        if (meta && t.sync_page_meta_description) meta.setAttribute('content', t.sync_page_meta_description);
        if (t.sync_page_title) document.title = t.sync_page_title;
        renderVersions();
        var label = t.select_language || '';
        var sw = document.getElementById('langSwitcher');
        if (sw && label) sw.setAttribute('aria-label', label);
        if (typeof window.buildDatabaseLangMenu === 'function') {
          window.buildDatabaseLangMenu('langSwitcher', false);
        }
        var btn = document.getElementById('mainLangBtn');
        if (btn && label) btn.setAttribute('aria-label', label);
        if (typeof window.refreshLangMenuChromeLabels === 'function') window.refreshLangMenuChromeLabels();
      }

      window.updateMainContent = applySyncPage;
      window.translatePage = applySyncPage;
      window.getTranslation = function (key) {
        var t = packFor(currentLang());
        if (key && t[key] != null && t[key] !== '') return t[key];
        var en = (window.translations && window.translations.en) || {};
        if (key && en[key] != null && en[key] !== '') return en[key];
        return '';
      };

      function finishLang(langCode) {
        var obj = window['lang_' + langCode];
        if (!window.translations) window.translations = {};
        if (obj) window.translations[langCode] = obj;
      }

      function loadLangScript(langCode, onDone) {
        if (window.translations && window.translations[langCode]) {
          if (onDone) onDone();
          return;
        }
        if (window['lang_' + langCode]) {
          finishLang(langCode);
          if (onDone) onDone();
          return;
        }
        var script = document.createElement('script');
        script.src = '/vb/lang/' + langCode + '.js?v=' + SYNC_LANG_ASSET_V;
        script.onload = function () {
          finishLang(langCode);
          if (onDone) onDone();
        };
        script.onerror = function () {
          if (onDone) onDone(new Error('lang'));
        };
        document.head.appendChild(script);
      }

      window.loadRootLanguage = function (lang, onDone) {
        if (!onDone) onDone = function () {};
        loadLangScript(lang, function (err) { onDone(err); });
      };

      function codes() {
        var list = window.pwaAvailableLanguages && window.pwaAvailableLanguages.length
          ? window.pwaAvailableLanguages
          : (window.DEFAULT_PWA_LANGUAGES || []);
        return list.map(function (e) { return e.code; }).filter(Boolean);
      }

      function boot() {
        var list = codes();
        var initial = (typeof window.resolvePwaLanguage === 'function')
          ? window.resolvePwaLanguage(list)
          : 'en';
        loadLangScript(initial, function (err) {
          if (err && initial !== 'en') {
            loadLangScript('en', function () { applySyncPage(); });
            return;
          }
          applySyncPage();
        });
      }

      fetch('/sync/version.json?_=' + Date.now(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (v) {
          if (v && v.windows) syncVersions.windows = String(v.windows);
          if (v && v.mac) syncVersions.mac = String(v.mac);
          renderVersions();
        })
        .catch(function () { renderVersions(); });

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', boot);
      } else {
        boot();
      }
    })();
  </script>
</body>
</html>
