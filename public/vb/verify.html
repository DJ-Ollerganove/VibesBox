<!DOCTYPE html>
<html lang="de">
<head>
  <base href="/vb/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>VibesBox – Konto</title>
  <link rel="icon" type="image/png" href="/vb/favicon.png">
  <style>
    :root {
      --vb-bg: #000000;
      --vb-fg: #f5f5f5;
      --vb-orange: #ff8800;
      --vb-success: #00e676;
      --vb-error: #ff5252;
      --vb-border: #2a2a2a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--vb-bg);
      color: var(--vb-fg);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      border: 1px solid var(--vb-border);
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      background: #0a0a0a;
      box-shadow: 0 12px 40px rgba(0,0,0,.55);
    }
    .verify-logo {
      display: block;
      height: 72px;
      width: auto;
      max-width: 100%;
      margin: 0 auto 1.25rem;
      object-fit: contain;
    }
    .verify-page-title {
      margin: 0 0 0.75rem;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: rgba(255,255,255,0.92);
      text-align: center;
    }
    .verify-processing {
      margin: 0;
      text-align: center;
      line-height: 1.5;
      color: rgba(255,255,255,0.75);
    }
    .verify-result-title {
      margin: 0 0 0.85rem;
      font-size: 1.3rem;
      font-weight: 700;
      line-height: 1.3;
      text-align: center;
    }
    .verify-result-title.title-success { color: var(--vb-success); }
    .verify-result-title.title-error { color: var(--vb-error); }
    .verify-result-body {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.55;
      color: rgba(255,255,255,0.88);
      text-align: center;
    }
    label { display: block; font-size: 0.85rem; margin-bottom: 0.35rem; color: #c8c8c8; }
    input[type="password"] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--vb-border);
      background: #050505;
      color: var(--vb-fg);
      margin-bottom: 0.75rem;
    }
    input:focus {
      outline: none;
      border-color: var(--vb-orange);
      box-shadow: 0 0 0 1px rgba(255,136,0,0.5);
    }
    .btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.95rem;
      background: var(--vb-orange);
      color: #000000;
      margin-top: 0.5rem;
    }
    .btn:hover { filter: brightness(1.05); }
    .btn-secondary {
      background: transparent;
      color: var(--vb-orange);
      border: 1px solid var(--vb-orange);
      margin-top: 0.75rem;
    }
    .hint { font-size: 0.8rem; color: #888; margin-top: -0.25rem; margin-bottom: 0.75rem; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="card" id="root">
    <img class="verify-logo" src="icon/vibesbox-logo.png" alt="VibesBox"
      onerror="this.onerror=null;this.src='favicon.png';" />
    <div id="phaseProcessing" class="verify-phase">
      <h1 class="verify-page-title" id="pageTitle"></h1>
      <p class="verify-processing" id="statusProcessing"></p>
    </div>
    <div id="phaseResult" class="verify-phase hidden">
      <p class="verify-result-title" id="resultTitle" role="status"></p>
      <p class="verify-result-body" id="resultBody"></p>
    </div>
    <div id="formWrap" class="hidden"></div>
    <button type="button" class="btn btn-secondary hidden" id="btnApp">App</button>
  </div>
  <script type="module" src="scripts/verify-auth.js"></script>
</body>
</html>
